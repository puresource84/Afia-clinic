# Afia Clinic - Docker stack.
# Secrets come from docker/.env (generated by install.sh, never committed).
# See .env.example for the variables.

# Own project name: without it Compose derives it from the folder ("docker"),
# which collides with an unrelated wordpress stack on this machine - a
# `docker compose down --remove-orphans` here would delete that container.
name: afia-qa

services:
  db:
    # PostgreSQL 16: the version this build was verified against
    # (see docs/TEST_REPORT_2026-10-30.md).
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env (run install.sh)}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    build: .
    depends_on:
      - db
    ports:
      # Bound to localhost only; put a reverse proxy / tunnel in front for
      # remote access. 8072 serves websockets (live chatter, notifications)
      # because odoo.conf runs with workers > 0.
      - "127.0.0.1:8169:8069"   # 8069 on the host is taken by another Odoo
      - "127.0.0.1:8172:8072"
    environment:
      # Read by the official image entrypoint; odoo.conf deliberately does
      # not set db_host/db_user/db_password so these values are used.
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env (run install.sh)}
    volumes:
      - odoo_data:/var/lib/odoo
      - ../modules:/mnt/extra-addons
      # Generated by install.sh from odoo.conf with a random master password.
      - ./odoo.generated.conf:/etc/odoo/odoo.conf:ro
    restart: unless-stopped

volumes:
  db_data:
  odoo_data:
