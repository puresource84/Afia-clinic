[options]
; Custom addons path — Odoo will also auto-discover its own built-in addons
addons_path = /mnt/extra-addons

; Data directory (filestore, sessions)
data_dir = /var/lib/odoo

; Master password — CHANGE THIS before first boot
admin_passwd = CHANGE_ME_master_password

; Database connection (values injected via Docker environment)
db_host = db
db_port = 5432
db_user = odoo
db_password = CHANGE_ME_strong_db_password

; Database — False means Odoo picks the name from the URL/session
db_name = False

; Security — hide DB list from public internet
list_db = False

; Required for Cloudflare Tunnel to pass correct client IPs
proxy_mode = True

; Workers — 2 is good for a single-clinic home server
workers = 2
max_cron_threads = 1

; Logging
logfile = /var/log/odoo/odoo.log
log_level = warn
