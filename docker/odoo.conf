[options]
; Template only. install.sh copies this to odoo.generated.conf and replaces
; __ADMIN_PASSWD__ with a random master password (also saved in docker/.env).
; db_host / db_user / db_password are intentionally absent: the Docker
; entrypoint injects them from docker-compose.yml (and docker/.env).

addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

admin_passwd = __ADMIN_PASSWD__

db_port = 5432
db_name = False

; Security - hide the database manager / list from the internet
list_db = False

; Required behind a reverse proxy or Cloudflare Tunnel (correct client IPs)
proxy_mode = True

; Workers - 2 is good for a single-clinic server. gevent_port serves
; websockets and must be published (see docker-compose.yml).
workers = 2
max_cron_threads = 1
gevent_port = 8072

; Logging to stdout -> `docker compose logs odoo`
log_level = warn
